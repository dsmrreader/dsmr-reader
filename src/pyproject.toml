[tool.poetry]
name = "DSMR-reader"
description = "DSMR-protocol reader, P1 telegram data storage and energy consumption visualizer"
license = "Creative Commons Attribution-NonCommercial 4 International Public License"
readme = 'README.md'
repository = "https://github.com/dsmrreader/dsmr-reader"
homepage = "https://dsmr-reader.readthedocs.io/"
authors = [
    "Dennis Siemensma",
    "https://github.com/dsmrreader/dsmr-reader/graphs/contributors"
]
package-mode = false


[tool.poetry.dependencies]
python = ">=3.13"

crcmod = "^1"
django = "^5.2"
django-admin-rangefilter = "^0.13"
django-admin-sortable = "^2"
django-colorfield = "^0.14"
django-debug-toolbar = "^6"
django-filter = "^24"  # v25 is incompatible and requires "drf-spectacular"
django-mathfilters = "^1"
djangorestframework = "^3"
django-solo = "^2"
dropbox = "^12"
gunicorn = "^23"
influxdb-client = "^1"
paho-mqtt = "^2"
psycopg2-binary = "^2"
pyserial = "^3"
pyserial-asyncio = "^0.6"
python-dateutil = "^2"
python-decouple = "^3"
pyyaml = "^6"
requests = "^2"
urllib3 = "^2"
attrs = "^25"


[tool.poetry.group.dev.dependencies]
flake8 = "^7"
flake8-bandit = "^4"
flake8-black = "^0.4"
flake8-bugbear = "^25"
polib = "^1"
pytest-cov = "^7"
pytest-django = "^4"
pytest-xdist = "^3"
mysqlclient = "^2"
safety = "^3"
sphinx = "^8"
sphinx-autobuild = "^2025"
sphinx-intl = "^2"
sphinx-rtd-theme = "^3"
mypy = "^1"
types-pytz = "^2025"
types-requests = "^2"
types-python-dateutil = "^2"
types-polib = "^1"
types-six = "^1"
uritemplate = "^4"
