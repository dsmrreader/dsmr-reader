[tool.poetry]
name = "DSMR-reader"
version = "v6"
description = "DSMR-protocol reader, P1 telegram data storage and energy consumption visualizer"
license = "Creative Commons Attribution-NonCommercial 4.0 International Public License"
readme = 'README.md'
repository = "https://github.com/dsmrreader/dsmr-reader"
homepage = "https://dsmr-reader.readthedocs.io/"
authors = [
    "Dennis Siemensma",
    "https://github.com/dsmrreader/dsmr-reader/graphs/contributors"
]


[tool.poetry.dependencies]
python = "^3.10 | ^3.11 | ^3.12"

crcmod = "^1.0"
django = "4.1"
django-admin-rangefilter = "^0.13"
django-admin-sortable = "^2.0"
django-colorfield = "^0.11"
django-debug-toolbar = "^4.0"
django-filter = "^23.0"  # @TODO: Upgrade later
django-mathfilters = "^1.0"
djangorestframework = "^3.0"
django-solo = "^2.0"
dropbox = "^11.0"  # @TODO: Upgrade later
gunicorn = "^22.0"
influxdb-client = "^1.0"
paho-mqtt = "^1.0"  # @TODO: Upgrade later
psycopg2-binary = "^2.0"
pyserial = "^3.0"
pyserial-asyncio = "^0.6"
python-dateutil = "^2.0"
python-decouple = "^3.0"
pytz = "^2024.0"
pyyaml = "^6.0"
requests = "^2.0"
urllib3 = "^1.0"
attrs = "^23.0"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.0"
flake8-bandit = "^4.0"
flake8-black = "^0.3"
flake8-bugbear = "^24.0"
polib = "^1.2"
pytest-cov = "^5.0"
pytest-django = "^4.0"
pytest-xdist = "^3.0"
mysqlclient = "^2.0"
safety = "^3.0"
sphinx = "^7.0"
sphinx-autobuild = "^2024.0"
sphinx-intl = "^2.0"
sphinx-rtd-theme = "^2.0"
mypy = "^1.0"
types-pytz = "^2024.0"
types-requests = "^2.0"
types-python-dateutil = "^2.0"
types-polib = "^1.0"
types-six = "^1.0"
uritemplate = "^4.0"
