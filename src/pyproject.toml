# Dependencies are managed with uv (`uv add`/`uv lock`); Poetry only installs/runs — see scripts/sync_poetry_lock.py.
[project]
name = "DSMR-reader"
description = "DSMR-protocol reader, P1 telegram data storage and energy consumption visualizer"
license = "LicenseRef-CC-BY-NC-4.0"
readme = "../README.md"
version = "0.0.0"
requires-python = ">=3.14,<4"
authors = [
    { name = "Dennis Siemensma" },
]
urls = { repository = "https://github.com/dsmrreader/dsmr-reader", homepage = "https://dsmr-reader.readthedocs.io/" }
dependencies = [
    "attrs>=25,<26",
    "crcmod>=1,<2",
    "django>=5.2,<6",
    "django-admin-rangefilter>=0.13,<0.14",
    "django-admin-sortable>=2,<3",
    "django-colorfield>=0.14,<0.15",
    "django-debug-toolbar>=6,<7",
    "django-filter>=25,<26",
    "drf-spectacular>=0,<1",
    "django-mathfilters>=1,<2",
    "django-solo>=2,<3",
    "djangorestframework>=3,<4",
    "dropbox>=12,<13",
    "gunicorn>=23,<24",
    "influxdb-client>=1,<2",
    "packaging>=25,<26",
    "paho-mqtt>=2,<3",
    "psycopg2-binary>=2,<3",
    "pyserial>=3,<4",
    "pyserial-asyncio>=0.6,<0.7",
    "python-dateutil>=2,<3",
    "python-decouple>=3,<4",
    "pyyaml>=6,<7",
    "requests>=2,<3",
    "urllib3>=2,<3",
    "uritemplate>=4,<5",
]

[dependency-groups]
dev = [
    "black>=25,<26",
    "djlint>=1,<2",
    "flake8>=7,<8",
    "flake8-bandit>=4,<5",
    "flake8-bugbear>=25,<26",
    "flake8-pyproject>=1,<2",
    "mypy>=1,<2",
    "polib>=1,<2",
    "pytest-cov>=7,<8",
    "pytest-django>=4,<5",
    "pytest-xdist>=3,<4",
    "regex>=2026,<2027",
    "types-polib>=1,<2",
    "types-python-dateutil>=2,<3",
    "types-pytz>=2025,<2026",
    "types-requests>=2,<3",
    "types-six>=1,<2",
    "django-stubs>=6.0.4,<7",
    "djangorestframework-stubs>=3.17.0,<4",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false

[tool.black]
line-length = 120


[tool.flake8]
select = ["B", "C", "E", "F", "I", "S", "W"]
# B902/B903: Methods should take at least two arguments - false positives on classmethods
# B950: Line too long - handled by Black at 120 chars
# E203: Whitespace before ':' - conflicts with Black formatting
# W503: Line break before binary operator - conflicts with Black formatting
# S311: Use of random module for security purposes - valid for non-crypto use
ignore = ["B902", "B903", "B950", "E203", "S311", "W503"]
exclude = [".venv/*", "docs/*", "provisioning/*", "tools/*", "*/migrations/*", "dsmrreader/*", "dsmr_plugins/modules/*", "dsmr_parser/*"]
max-complexity = 10
max-line-length = 120

per-file-ignores = [
    "*/tests/*:E501",  # Allow longer lines in tests
]


[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = [".*/migrations/"]

[tool.django-stubs]
django_settings_module = "dsmrreader.config.test"

[[tool.mypy.overrides]]
module = "paho.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dropbox.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "influxdb_client.*"
ignore_missing_imports = true


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dsmrreader.config.test"
pythonpath = "."
addopts = "--cov=. --cov-report=html:coverage_report/html -q"
testpaths = ["dsmr_api/tests", "dsmr_backend/tests", "dsmr_backup/tests", "dsmr_consumption/tests", "dsmr_datalogger/tests", "dsmr_dropbox/tests", "dsmr_frontend/tests", "dsmr_influxdb/tests", "dsmr_mindergas/tests", "dsmr_mqtt/tests", "dsmr_notification/tests", "dsmr_plugins/tests", "dsmr_pvoutput/tests", "dsmr_stats/tests", "dsmr_weather/tests"]


[tool.coverage.run]
branch = true
omit = [
    "./*/__init__.py",
    "./.venv/*",
    "./*/tests/*",
    "./*/migrations/*",
    "./dsmr_backend/mixins.py",
    "./dsmr_plugins/modules/*",
    "./dsmr_dropbox/dropboxinc/*",
    "./dsmr_parser/*",
    "./dsmrreader/config/*",
]

[tool.coverage.html]
directory = "coverage_report/html"

[tool.djlint]
profile = "django"
line_break_after_multiline_tag = true
preserve_blank_lines = true
exclude = "^.*(\\.venv|coverage_report|migrations|dsmr_parser|dsmr_plugins/modules).*$"


