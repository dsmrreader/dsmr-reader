default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: bash -c 'cd src && poetry run black .'
        language: system
        pass_filenames: false
        types: [python]

      - id: djlint
        name: djlint
        entry: bash -c 'cd src && poetry run djlint --reformat .'
        language: system
        pass_filenames: false
        types: [html]

      - id: mypy
        name: mypy
        entry: bash -c 'cd src && poetry run mypy /app/src'
        language: system
        pass_filenames: false
        types: [python]

      - id: flake8
        name: flake8
        entry: bash -c 'cd src && poetry run flake8'
        language: system
        pass_filenames: false
        types: [python]
