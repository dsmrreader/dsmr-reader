site_name: DSMR-reader v6.x Documentation
site_description: DSMR-reader
site_author: Dennis Siemensma
copyright: © Dennis Siemensma
theme:
  name: material
  features:  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.follow
markdown_extensions:
  - toc:
      baselevel: 1
  # https://squidfunk.github.io/mkdocs-material/reference/admonitions/#supported-types
  - admonition
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - css/style.css
plugins:
  - toc-md:
      toc_page_title: DSMR-reader documentation
      toc_page_description: See top bar and sidebar for a more specific navigation.
      header_level: 3
