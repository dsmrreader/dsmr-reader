name: Check Latest Pre-Release

on:
  workflow_dispatch:

jobs:
  check-latest-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get recent releases
        id: get_releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5
            });
            if (!releases.data.length) {
              core.setFailed('No releases found.');
              return;
            }
            const preReleases = releases.data.filter(r => r.prerelease);
            if (!preReleases.length) {
              core.setFailed('No pre-releases found.');
              return;
            }
            const now = new Date();
            const recent = preReleases.filter(r => {
              const published = new Date(r.published_at);
              return (now - published) < 24 * 60 * 60 * 1000;
            });
            if (!recent.length) {
              core.setFailed('No pre-releases in the last 24 hours.');
              return;
            }
            // Sort by published date descending
            recent.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
            const latest = recent[0];
            core.setOutput('target_commitish', latest.target_commitish);
            core.setOutput('tag_name', latest.tag_name);

      - name: Print release info
        run: |
          echo "target_commitish: ${{ steps.get_releases.outputs.target_commitish }}"
          echo "tag_name: ${{ steps.get_releases.outputs.tag_name }}"
