name: Automated tests

on:
  push:
    branches:
      - 'v*'
      - 'development'
      - 'wip/*'
  pull_request:
    branches-ignore:
      - 'dependabot/'

jobs:
  main_test:
    name: 'CI Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_VERSION: '3.14'
      # Do not log verbosely
      DSMRREADER_LOGLEVEL: ERROR
    steps:
      - uses: actions/checkout@v7

      - name: Restore PostgreSQL image cache
        id: postgres-image-cache
        uses: actions/cache@v6
        with:
          path: /tmp/postgres-image.tar
          key: postgres-image-${{ hashFiles('provisioning/container/compose.test.yml') }}

      - name: Load cached PostgreSQL image
        if: steps.postgres-image-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/postgres-image.tar

      - name: Pull and save PostgreSQL image
        if: steps.postgres-image-cache.outputs.cache-hit != 'true'
        run: |
          image=$(grep -oP 'image:\s*\Kpostgres:\S+' provisioning/container/compose.test.yml)
          for attempt in 1 2 3; do docker pull "$image" && break || sleep $((attempt * 20)); done
          docker save "$image" --output /tmp/postgres-image.tar

      - name: Build and run Python ${{ env.PYTHON_VERSION }} app image
        run: |
          ln -s provisioning/container/compose.test.yml compose.yml
          docker compose build --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          docker compose up -d --remove-orphans
          sleep 5

      - name: Check code formatting with Black
        run: docker compose run --rm tests-dsmr-app poetry run black --check .

      - name: Check Django templates with djLint
        run: docker compose run --rm tests-dsmr-app poetry run djlint --check .

      - name: Check flake8
        run: docker compose run --rm tests-dsmr-app poetry run flake8 -v

      - name: Type check with MyPy
        run: docker compose run --rm tests-dsmr-app poetry run mypy /app/src

      - name: Run PostgreSQL tests
        run: docker compose run --rm tests-dsmr-app poetry run pytest
