name: Automated tests

on:
  push:
    branches:
      - 'v*'
      - 'development'
  pull_request:
    branches-ignore:
      - 'dependabot/'

jobs:
  main_test:
    name: 'Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version:
          - '3.13'
    env:
      # Do not log verbosely
      DSMRREADER_LOGLEVEL: ERROR
    steps:
      - uses: actions/checkout@v5

      - name: Build docker image(s)
        run: |
          ln -s provisioning/container/compose.test.yml compose.yml
          docker compose build

      - name: Run docker image(s)
        run: |
          docker compose up -d
          sleep 5

      - name: Check code formatting with Black
        run: docker compose run tests-dsmr-app poetry run black --check .

      - name: Check flake8
        run: docker compose run tests-dsmr-app poetry run flake8 -v

      - name: Type check with MyPy
        run: docker compose run tests-dsmr-app poetry run mypy /app

      - name: Check dependency vulnerabilities with Safety
        run: docker compose run tests-dsmr-app poetry run safety check --json
        continue-on-error: true

      - name: Run PostgreSQL tests
        run: docker compose run tests-dsmr-app poetry run pytest
